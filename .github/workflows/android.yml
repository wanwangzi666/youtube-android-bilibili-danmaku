name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # ubuntu runner 镜像已预装 Android SDK；显式声明路径，避免依赖第三方 setup action
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- platforms ---";   ls "$ANDROID_HOME/platforms"   2>/dev/null || echo "(none)"
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools"  2>/dev/null || echo "(none)"

      - name: Ensure SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -maxdepth 5 -name sdkmanager -type f 2>/dev/null | head -n1)"
          echo "sdkmanager=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          else
            echo "sdkmanager not found; rely on preinstalled SDK"
          fi
          echo "--- after ---"
          ls "$ANDROID_HOME/platforms"  2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: b2y-vector-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

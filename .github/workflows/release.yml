name: Release

on:
  push:
    tags: [ 'v*' ]

# 创建 Release 需要写权限；GitHub 会自动注入 GITHUB_TOKEN
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -maxdepth 5 -name sdkmanager -type f 2>/dev/null | head -n1)"
          echo "sdkmanager=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare release assets
        run: |
          set -e
          mkdir -p out
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="out/B2Y-Vector-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          sha256sum "$ASSET" | awk '{print $1}' > "${ASSET}.sha256"
          ls -lh out
          cat "${ASSET}.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "B2Y for Vector ${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_NOTES.md \
            --verify-tag \
            out/B2Y-Vector-*-debug.apk out/B2Y-Vector-*-debug.apk.sha256
